# Linux-only (Debian/Ubuntu/Pop!_OS, Gnome)
# ==============================
# Gnome desktop config

- defaults:
    link:
      create: true
      relink: true

- link:
    # ── Git tooling (lazygit reads ~/.config on Linux) ───────────────
    ~/.config/lazygit/config.yml: user-config/lazygit/config.yml

- shell:
    # ── Gnome desktop settings ────────────────────────────────────────
    - description: Configure Gnome workspaces and keybindings
      command: |
        gsettings set org.gnome.Terminal.Legacy.Settings headerbar false 2>/dev/null || true
        gsettings set org.gnome.desktop.wm.preferences num-workspaces 10
        gsettings set "org.gnome.desktop.wm.keybindings" "close" "['<Super>q']"
        for i in $(seq 1 10); do
          key=$([ "$i" -eq 10 ] && echo 0 || echo "$i")
          [ "$i" -ne 10 ] && gsettings set "org.gnome.shell.keybindings" "switch-to-application-$i" "[]" 2>/dev/null || true
          gsettings set "org.gnome.desktop.wm.keybindings" "switch-to-workspace-$i" "['<Super>$key']"
          dconf write "/org/gnome/desktop/wm/keybindings/move-to-workspace-$i" "['<Super><Shift>$key']"
        done
      stderr: true
      stdin: false
      stdout: true

    - description: Configure Flameshot screenshot binding
      command: |
        FLAMESHOT_PATH="/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/"
        dconf write "${FLAMESHOT_PATH}name" "'Flameshot'"
        dconf write "${FLAMESHOT_PATH}command" "'flameshot gui'"
        dconf write "${FLAMESHOT_PATH}binding" "'<Alt><Shift>4'"
        gsettings set org.gnome.settings-daemon.plugins.media-keys custom-keybindings "['$FLAMESHOT_PATH']"
      stderr: true
      stdin: false
      stdout: true