# Global mise config (symlinked to ~/.config/mise/config.toml); also used as this repo's dev tools

[tools]
bun = "latest"
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:plantuml/plantuml" = "latest"
herdr = "latest"
java = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "latest"
python = "latest"
ruby = "latest"
usage = "latest"
uv = "0.13.8"
"npm:diff2html-cli" = "latest"
glab = "latest"
opencode = "latest"

[settings]
idiomatic_version_file_enable_tools = []
experimental = true

[settings.ruby]
compile = false
