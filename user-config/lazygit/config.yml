git:
  diffRenderers:
    - command: delta --dark --paging=never --line-numbers
    - command: difft --color=always
      type: extDiff
customCommands:
  - key: D
    context: commits
    description: Open commit in diffnav
    command: git show --format= {{.SelectedLocalCommit.Hash}} | diffnav
    output: terminal
  - key: D
    context: localBranches
    description: Review branch vs main in diffnav
    command: "b=main; git rev-parse --verify -q main >/dev/null || b=master; git diff $b...{{.SelectedLocalBranch.Name}} | diffnav"
    output: terminal
  - key: D
    context: files
    description: Open working changes in diffnav
    command: git diff HEAD | diffnav
    output: terminal
  # ,mobile-review: write a folder (00_diff.html + rendered markdown files of the diff) into the Syncthing review folder (tablet)
  - key: Y
    context: commits
    description: Send commit to tablet (,mobile-review)
    command: ",mobile-review diff --commit {{.SelectedLocalCommit.Hash}}"
    output: popup
  - key: Y
    context: localBranches
    description: Send branch vs main to tablet (,mobile-review)
    command: ",mobile-review diff --range main...{{.SelectedLocalBranch.Name}}"
    output: popup
  - key: Y
    context: files
    description: Send working changes to tablet (,mobile-review)
    command: ",mobile-review diff --working"
    output: popup
